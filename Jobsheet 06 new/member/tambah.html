<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SportSpace | Tambah Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05) !important; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    
    <header class="navbar navbar-expand-lg navbar-dark shadow-sm bg-aesthetic sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="bi bi-controller me-1 text-warning"></i> SportSpace
            </a>
            <button id="nav-toggle-btn" class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../arena/list.html">Daftar Arena</a></li>
                    <li class="nav-item"><a class="nav-link" href="../arena/tambah.html">Tambah Arena</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Member</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="tambah.html">Tambah Member</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5" style="max-width: 650px;">
        <section class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="text-white p-4 text-center" style="background: linear-gradient(135deg, #8FA396 0%, #6b8676 100%);">
                <i class="bi bi-person-vcard fs-1 text-warning mb-2 d-block"></i>
                <h3 class="fw-bold m-0">Registrasi Member</h3>
                <p class="mb-0 text-white-50 small">Daftarkan pelanggan setia baru</p>
            </div>

            <div class="card-body p-4 p-md-5 bg-white">
                <form id="form-tambah" action="list.html">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label for="id_member" class="form-label fw-semibold text-secondary small text-uppercase">ID Member</label>
                            <input type="text" class="form-control form-control-lg rounded-3 shadow-sm border-0 bg-light" id="id_member" name="id_member" placeholder="Contoh: M-001" required>
                        </div>
                        <div class="col-md-6">
                            <label for="tipe" class="form-label fw-semibold text-secondary small text-uppercase">Tipe Keanggotaan</label>
                            <select class="form-select form-select-lg rounded-3 shadow-sm border-0 bg-light" id="tipe" name="tipe">
                                <option value="Reguler">Reguler (Standar)</option>
                                <option value="VIP">VIP (Prioritas)</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="nama" class="form-label fw-semibold text-secondary small text-uppercase">Nama Lengkap</label>
                            <input type="text" class="form-control form-control-lg rounded-3 shadow-sm border-0 bg-light" id="nama" name="nama" required>
                        </div>
                        <div class="col-md-6">
                            <label for="no_hp" class="form-label fw-semibold text-secondary small text-uppercase">No. HP / WhatsApp</label>
                            <input type="text" class="form-control form-control-lg rounded-3 shadow-sm border-0 bg-light" id="no_hp" name="no_hp" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold text-secondary small text-uppercase">Email Aktif</label>
                            <input type="email" class="form-control form-control-lg rounded-3 shadow-sm border-0 bg-light" id="email" name="email">
                        </div>
                        <div class="col-12 mt-5">
                            <button type="submit" class="btn w-100 text-white fw-bold rounded-pill py-3 shadow-sm hover-lift" style="background-color: #8FA396;">
                                <i class="bi bi-person-check-fill me-2"></i>Simpan Data Member
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-4 mt-auto border-top bg-white">
        <p class="mb-0 fw-medium">&copy; 2026 SportSpace &mdash; Jobsheet 6</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
