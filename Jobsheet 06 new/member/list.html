<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SportSpace | Daftar Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05) !important; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    
    <header class="navbar navbar-expand-lg navbar-dark shadow-sm bg-aesthetic sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="bi bi-controller me-1 text-warning"></i> SportSpace
            </a>
            <button id="nav-toggle-btn" class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2 align-items-center">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../arena/list.html">Daftar Arena</a></li>
                    <li class="nav-item"><a class="nav-link" href="../arena/tambah.html">Tambah Arena</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="list.html">Daftar Member</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Member</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <section class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="p-4 text-white" style="background: linear-gradient(135deg, #8FA396 0%, #6b8676 100%);">
                <h3 class="fw-bold m-0"><i class="bi bi-people-fill me-2"></i>Daftar Member</h3>
                <p class="mb-0 text-white-50 small">Kelola data pelanggan dan keanggotaan</p>
            </div>

            <div class="card-body p-4 bg-white">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
                    <div class="input-group shadow-sm" style="max-width: 350px;">
                        <span class="input-group-text bg-white border-aesthetic text-aesthetic" style="border-color: #8FA396 !important;"><i class="bi bi-search"></i></span>
                        <input type="text" id="search-input" class="form-control border-start-0 border-aesthetic" style="border-color: #8FA396 !important;" placeholder="Cari member...">
                    </div>
                    <div class="d-flex gap-2">
                        <button id="btn-muat-ulang" class="btn text-secondary bg-light rounded-pill px-4 shadow-sm border hover-lift"><i class="bi bi-arrow-clockwise me-1"></i> Muat Ulang</button>
                        <a href="tambah.html" class="btn text-white rounded-pill px-4 shadow-sm hover-lift" style="background-color: #8FA396;"><i class="bi bi-person-plus-fill me-1"></i> Registrasi Member</a>
                    </div>
                </div>
                
                <p id="loading-indicator" class="text-center text-secondary py-3" style="display:none;"><i class="bi bi-hourglass-split me-2"></i>Memuat data...</p>
                
                <div class="table-responsive rounded-3 border-0 shadow-sm">
                    <table class="table table-hover align-middle mb-0 border-white">
                        <thead class="bg-light text-secondary" style="border-bottom: 2px solid #eef3f0;">
                            <tr>
                                <th class="py-3 ps-4 text-uppercase" style="font-size: 0.85rem;">ID Member</th>
                                <th class="py-3 text-uppercase" style="font-size: 0.85rem;">Nama Lengkap</th>
                                <th class="py-3 text-uppercase" style="font-size: 0.85rem;">Tipe</th>
                                <th class="py-3 text-uppercase" style="font-size: 0.85rem;">No. HP</th>
                                <th class="py-3 text-center text-uppercase" style="font-size: 0.85rem;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-member">
                            <!-- Data dimuat oleh member.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-4 mt-auto border-top bg-white">
        <p class="mb-0 fw-medium">&copy; 2026 SportSpace &mdash; Jobsheet 6</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/member.js"></script>
</body>
</html>
