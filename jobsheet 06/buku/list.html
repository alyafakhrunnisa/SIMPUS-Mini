<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    
    <header class="navbar navbar-expand-lg navbar-dark shadow-sm bg-aesthetic">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">SIMPUS-Mini</a>
            <button id="nav-toggle-btn" class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2 align-items-center">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <section class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
                    <h2 class="card-title fw-bold m-0 text-aesthetic">Daftar Buku</h2>
                    
                    <!-- Fitur Search Bar Aesthetic -->
                    <div class="input-group shadow-sm" style="max-width: 350px;">
                        <input type="text" id="search-input" class="form-control rounded-start-pill border-aesthetic" placeholder="Cari judul, pengarang, ISBN...">
                        <button class="btn bg-aesthetic text-white rounded-end-pill px-4" type="button">Cari</button>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="btn-muat-ulang" class="btn text-secondary bg-light rounded-pill px-4 shadow-sm border">↻ Muat Ulang</button>
                        <a href="tambah.html" class="btn text-white rounded-pill px-4 bg-aesthetic shadow-sm">+ Tambah Anggota</a>
                    </div>
                </div>
                <p id="loading-indicator" class="text-center text-secondary" style="display:none;">Memuat data...</p>
                <div class="table-responsive rounded-3 border">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-aesthetic text-white">
                            <tr>
                                <th class="py-2">Judul</th>
                                <th>Pengarang</th>
                                <th>Kategori</th>
                                <th>ISBN</th>
                                <th>Stok</th>
                                <th class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-4 mt-auto">
        <p class="mb-0 fw-medium">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6 </p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>
</html>
