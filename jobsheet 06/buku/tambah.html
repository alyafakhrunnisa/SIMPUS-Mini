<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    
    <header class="navbar navbar-expand-lg navbar-dark shadow-sm bg-aesthetic sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="bi bi-book-half me-1 text-warning"></i> SIMPUS-Mini
            </a>
            <button id="nav-toggle-btn" class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5" style="max-width: 650px;">
        <section class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="bg-aesthetic text-white p-4 text-center" style="background: linear-gradient(135deg, #4A6054 0%, #6b8676 100%);">
                <i class="bi bi-journal-plus fs-1 text-warning mb-2 d-block"></i>
                <h3 class="fw-bold m-0">Tambah Buku Baru</h3>
                <p class="mb-0 text-white-50 small">Masukkan detail literatur ke dalam sistem</p>
            </div>
            
            <div class="card-body p-4 p-md-5 bg-white">
                <form id="form-tambah" action="list.html">
                    <div class="row g-4">
                        <div class="col-12">
                            <label for="judul" class="form-label fw-semibold text-secondary small text-uppercase">Judul Buku</label>
                            <input type="text" class="form-control form-control-lg rounded-3 shadow-sm border-0 bg-light" id="judul" name="judul" required>
                        </div>
                        <div class="col-12">
                            <label for="pengarang" class="form-label fw-semibold text-secondary small text-uppercase">Pengarang</label>
                            <input type="text" class="form-control form-control-lg rounded-3 shadow-sm border-0 bg-light" id="pengarang" name="pengarang" required>
                        </div>
                        <div class="col-md-6">
                            <label for="tahun" class="form-label fw-semibold text-secondary small text-uppercase">Tahun Terbit</label>
                            <input type="number" class="form-control form-control-lg rounded-3 shadow-sm border-0 bg-light" id="tahun" name="tahun" min="1900" max="2026" required>
                        </div>
                        <div class="col-md-6">
                            <label for="isbn" class="form-label fw-semibold text-secondary small text-uppercase">ISBN</label>
                            <input type="text" class="form-control form-control-lg rounded-3 shadow-sm border-0 bg-light" id="isbn" name="isbn">
                        </div>
                        <div class="col-md-6">
                            <label for="stok" class="form-label fw-semibold text-secondary small text-uppercase">Stok</label>
                            <input type="number" class="form-control form-control-lg rounded-3 shadow-sm border-0 bg-light" id="stok" name="stok" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label for="kategori" class="form-label fw-semibold text-secondary small text-uppercase">Kategori</label>
                            <select class="form-select form-select-lg rounded-3 shadow-sm border-0 bg-light" id="kategori" name="kategori">
                                <option value="fiksi">Fiksi</option>
                                <option value="non-fiksi">Non-Fiksi</option>
                                <option value="referensi">Referensi</option>
                            </select>
                        </div>
                        <div class="col-12 mt-5">
                            <button type="submit" class="btn w-100 text-white fw-bold rounded-pill py-3 shadow-sm bg-aesthetic hover-lift">
                                <i class="bi bi-save-fill me-2"></i>Simpan Data Buku
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-4 mt-auto border-top bg-white">
        <p class="mb-0 fw-medium">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
