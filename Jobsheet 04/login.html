<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Login Petugas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="py-3 shadow-sm bg-aesthetic">
        <div class="container text-center text-md-start">
            <h1 class="h4 mb-0 text-white fw-bold">SIMPUS-Mini</h1>
        </div>
    </header>

    <main class="container d-flex justify-content-center align-items-center flex-grow-1" style="min-height: 75vh;">
        <section class="card shadow-sm border-0 w-100 rounded-4" style="max-width: 400px;">
            <div class="card-body p-4 p-md-5">
                <h2 class="card-title text-center mb-2 fw-bold text-aesthetic">Login Petugas</h2>
                <p class="text-center text-secondary mb-4 small">Silakan masuk menggunakan kredensial Anda.</p>
                
                <form action="index.html">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <input type="text" class="form-control rounded-3" id="username" name="username" placeholder="Masukkan username" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Masukkan password" required>
                    </div>
                    
                    <button type="submit" class="btn text-white w-100 fw-bold py-2 shadow-sm rounded-pill bg-aesthetic">Masuk</button>
                </form>

                <p class="text-center mt-4 mb-0 small">
                    Belum punya akun? <a href="#" class="fw-semibold text-aesthetic" style="text-decoration: none;">Daftar di sini</a>
                </p>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-4 mt-auto">
        <p class="mb-0 fw-medium">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4 </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
