<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Login Petugas</title>
    
    <!-- Memanggil CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS Custom kamu tetap dipanggil untuk menimpa warna bawaan Bootstrap -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <!-- Header simpel -->
    <header class="py-3 shadow-sm" style="background-color: #1d5b8a;">
        <div class="container text-center text-md-start">
            <h1 class="h4 mb-0 text-white fw-bold">SIMPUS-Mini</h1>
        </div>
    </header>

    <!-- Main Content dengan Flexbox Bootstrap agar posisi ke tengah -->
    <main class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
        <section class="card shadow border-0 w-100" style="max-width: 400px; border-radius: 12px;">
            <div class="card-body p-4 p-md-5">
                <h2 class="card-title text-center mb-2 fw-bold" style="color: #1d5b8a;">Login Petugas</h2>
                <p class="text-center text-secondary mb-4 small">Silakan masuk menggunakan kredensial Anda.</p>
                
                <form action="index.html">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <!-- Menggunakan form-control bawaan Bootstrap -->
                        <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <!-- input type="password" agar tersensor -->
                        <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required>
                    </div>
                    
                    <button type="submit" class="btn text-white w-100 fw-bold py-2" style="background-color: #1d5b8a; border-radius: 6px;">Masuk</button>
                </form>

                <p class="text-center mt-4 mb-0 small">
                    Belum punya akun? <a href="#" class="fw-semibold" style="color: #1d5b8a; text-decoration: none;">Daftar di sini</a>
                </p>
            </div>
        </section>
    </main>

    <footer class="text-center py-4 text-secondary small">
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
