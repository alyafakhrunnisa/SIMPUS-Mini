<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/CSS/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    
    <header class="navbar navbar-expand-lg navbar-dark shadow-sm bg-aesthetic">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../Anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../Anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5" style="max-width: 600px;">
        <section class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <h2 class="card-title mb-4 fw-bold text-center text-aesthetic">Form Tambah Buku</h2>
                <form action="list.html">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="judul" class="form-label fw-medium text-secondary">Judul Buku</label>
                            <input type="text" class="form-control rounded-3" id="judul" name="judul" required>
                        </div>
                        <div class="col-12">
                            <label for="pengarang" class="form-label fw-medium text-secondary">Pengarang</label>
                            <input type="text" class="form-control rounded-3" id="pengarang" name="pengarang" required>
                        </div>
                        <div class="col-md-6">
                            <label for="tahun" class="form-label fw-medium text-secondary">Tahun Terbit</label>
                            <input type="number" class="form-control rounded-3" id="tahun" name="tahun" min="1900" max="2026" required>
                        </div>
                        <div class="col-md-6">
                            <label for="isbn" class="form-label fw-medium text-secondary">ISBN</label>
                            <input type="text" class="form-control rounded-3" id="isbn" name="isbn">
                        </div>
                        <div class="col-md-6">
                            <label for="stok" class="form-label fw-medium text-secondary">Stok</label>
                            <input type="number" class="form-control rounded-3" id="stok" name="stok" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label for="kategori" class="form-label fw-medium text-secondary">Kategori</label>
                            <select class="form-select rounded-3" id="kategori" name="kategori">
                                <option value="fiksi">Fiksi</option>
                                <option value="non-fiksi">Non-Fiksi</option>
                                <option value="referensi">Referensi</option>
                            </select>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn w-100 text-white fw-bold rounded-pill py-2 shadow-sm bg-aesthetic">Simpan Data Buku</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-4 mt-auto">
        <p class="mb-0 fw-medium">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
